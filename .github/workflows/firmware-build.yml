name: Firmware Build

on:
  push:
    branches:
      - "**"
    paths:
      - "firmware/**"
      - "tests/**"
      - "scripts/check_upgrade_contract.py"
      - "tools/idf-build.sh"
      - ".github/workflows/firmware-build.yml"
      - ".github/workflows/firmware-release.yml"
  pull_request:
    paths:
      - "firmware/**"
      - "tests/**"
      - "scripts/check_upgrade_contract.py"
      - "tools/idf-build.sh"
      - ".github/workflows/firmware-build.yml"
      - ".github/workflows/firmware-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ESP32 firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run firmware contract and host tests
        run: |
          set -euo pipefail
          node --test tests/*.test.mjs
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -Ifirmware/components/dc_bambu/include \
            tests/dc_bambu_light_parse_test.c -o /tmp/pcv-bambu-test
          /tmp/pcv-bambu-test

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.3.1
          target: esp32
          path: .
          command: tools/idf-build.sh firmware esp32 build

      - name: Verify in-place upgrade contract
        run: python3 scripts/check_upgrade_contract.py

      - name: Upload firmware build outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: panda-control-vent-firmware-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            firmware/build/dragonvent.bin
            firmware/build/dragonvent.elf
            firmware/build/dragonvent.map
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/ota_data_initial.bin
            firmware/build/flasher_args.json
            firmware/build/flash_args
