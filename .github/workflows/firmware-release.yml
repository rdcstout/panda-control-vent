name: Firmware Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update, for example v0.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Verify release tag and run checks
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^set(PROJECT_VER "\([^"]*\)")/\1/p' firmware/CMakeLists.txt)"
          test -n "$version"
          test "$RELEASE_TAG" = "v$version" || {
            echo "release tag $RELEASE_TAG does not match firmware version $version" >&2
            exit 1
          }
          node --test tests/*.test.mjs
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -Ifirmware/components/dc_bambu/include \
            tests/dc_bambu_light_parse_test.c -o /tmp/pcv-bambu-test
          /tmp/pcv-bambu-test

      - name: Stage release
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${RELEASE_TAG#v}"
          OTA="Panda-Control-Vent-${version}-OTA.bin"
          STABLE="Panda-Control-Vent-OTA.bin"
          test -f "release/${OTA}"
          test -f "release/${STABLE}"
          (cd release && sha256sum -c SHA256SUMS)
          cmp "release/${OTA}" "release/${STABLE}"
          cp "release/${OTA}" "dist/${OTA}"
          cp "release/${STABLE}" "dist/${STABLE}"
          cp release/SHA256SUMS dist/SHA256SUMS
          ls -lh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          # Pull this version's section from CHANGELOG.md (## [x.y.z] .. next ## [).
          changelog="$(awk -v v="${RELEASE_TAG#v}" '
            $0 ~ ("^## \\[" v "\\]") {f=1; next}
            f && /^## \[/ {exit}
            f {print}
          ' CHANGELOG.md 2>/dev/null || true)"

          cat > release_notes.md <<NOTES
          ## Downloads

          - **\`Panda-Control-Vent-${RELEASE_TAG#v}-OTA.bin\`** — versioned OTA image.
          - **\`Panda-Control-Vent-OTA.bin\`** — stable filename for direct links and automation.

          Both BIN files contain the same firmware. SHA-256 checksums are provided in **\`SHA256SUMS\`**.

          See the [installation guide](https://github.com/rdcstout/panda-control-vent/blob/${RELEASE_TAG}/docs/INSTALLATION.md) for supported hardware, updating, settings preservation, and checksum verification. Help is in [troubleshooting](https://github.com/rdcstout/panda-control-vent/blob/${RELEASE_TAG}/docs/TROUBLESHOOTING.md).

          Panda Control Vent is unofficial and is not endorsed by BIGTREETECH or Bambu Lab.

          Panda Control Vent is free. If it helps in your shop, you can optionally [support future Extrusion Therapy tools](https://buy.stripe.com/fZu3cw2Mnfr0d7N3ws1kA00). Downloads and source remain available without payment.
          NOTES

          # Open the release with this version's changes.
          if [ -n "$(printf '%s' "$changelog" | tr -d '[:space:]')" ]; then
            { printf "## What's new in %s\n%s\n\n" "$RELEASE_TAG" "$changelog"; cat release_notes.md; } > release_notes.md.new
            mv release_notes.md.new release_notes.md
          fi

          # Hyphenated versions are prereleases; normal semantic versions are
          # published as the latest stable release.
          PRERELEASE_FLAGS=""
          case "$RELEASE_TAG" in
            *-*) PRERELEASE_FLAGS="--prerelease"
                 echo "Publishing $RELEASE_TAG as a pre-release" ;;
            *)   PRERELEASE_FLAGS="--latest"
                 echo "Publishing $RELEASE_TAG as a stable release" ;;
          esac

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file release_notes.md $PRERELEASE_FLAGS
          else
            gh release create "$RELEASE_TAG" dist/* \
              --title "$RELEASE_TAG" \
              --notes-file release_notes.md $PRERELEASE_FLAGS
          fi
