name: Firmware Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update, for example v0.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Verify release tag and run checks
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^set(PROJECT_VER "\([^"]*\)")/\1/p' firmware/CMakeLists.txt)"
          test -n "$version"
          test "$RELEASE_TAG" = "v$version" || {
            echo "release tag $RELEASE_TAG does not match firmware version $version" >&2
            exit 1
          }
          node --test tests/*.test.mjs
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -Ifirmware/components/dc_bambu/include \
            tests/dc_bambu_light_parse_test.c -o /tmp/pcv-bambu-test
          /tmp/pcv-bambu-test

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.3.1
          target: esp32
          path: .
          command: tools/idf-build.sh firmware esp32 build

      - name: Verify in-place upgrade contract
        run: python3 scripts/check_upgrade_contract.py

      - name: Stage release
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${RELEASE_TAG#v}"
          OTA="Panda-Control-Vent-${version}-OTA.bin"
          STABLE="Panda-Control-Vent-OTA.bin"
          test -f "release/${OTA}"
          test -f "release/${STABLE}"
          (cd release && sha256sum -c SHA256SUMS)
          cmp "release/${OTA}" "release/${STABLE}"
          cp "release/${OTA}" "dist/${OTA}"
          cp "release/${STABLE}" "dist/${STABLE}"
          cp release/SHA256SUMS dist/SHA256SUMS
          ls -lh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          # Pull this version's section from CHANGELOG.md (## [x.y.z] .. next ## [).
          changelog="$(awk -v v="${RELEASE_TAG#v}" '
            $0 ~ ("^## \\[" v "\\]") {f=1; next}
            f && /^## \[/ {exit}
            f {print}
          ' CHANGELOG.md 2>/dev/null || true)"

          cat > release_notes.md <<NOTES
          ## Install from the existing web interface

          Panda Control Vent uses the compatible Panda Vent/DragonVent partition layout. The web updater writes only the inactive application slot; it does not erase the settings partition.

          - **\`Panda-Control-Vent-${RELEASE_TAG#v}-OTA.bin\`** — versioned OTA image.
          - **\`Panda-Control-Vent-OTA.bin\`** — stable filename for direct links and automation.

          ### Install over stock (recommended)

          1. Download **\`Panda-Control-Vent-${RELEASE_TAG#v}-OTA.bin\`** from the Assets below.
          2. Put the **stock** Panda Vent on your network and open its web UI (\`http://PandaVent.local/\` or its IP).
          3. On the stock firmware-update page, upload the OTA image and wait for the controller to restart.
          4. Existing compatible network and printer settings are retained. If setup is required, join **\`Panda_Control_Vent_XXXX\`** and complete setup.

          ### Updating DragonVent or Panda Control Vent

          Open the embedded interface, go to **Setup → Maintenance**, upload the OTA image, and wait for the interface to confirm that the controller has returned.

          ### ⚠ Upgrading from 0.4.x (one-time roll-back)

          0.4.x used a **different partition table**, so you can't OTA straight from 0.4.x to 0.5.x. Roll back to your stock backup over USB first, then install over stock from the web UI as above:

          \`\`\`
          python -m esptool --chip esp32 -p PORT -b 460800 write_flash 0x0 stock-panda-vent-backup.bin
          \`\`\`

          0.5.0 and later update **in place** (inactive-slot OTA) — no roll-back needed again.

          ### Keep stock firmware available

          Download and retain the official Panda Vent stock firmware before installing community firmware. Panda Control Vent is unofficial and is not endorsed by BIGTREETECH or Bambu Lab.

          ### Verify download

          \`\`\`
          shasum -a 256 -c SHA256SUMS
          \`\`\`

          Panda Control Vent is free. If it helps in your shop, you can optionally [support future Extrusion Therapy tools](https://buy.stripe.com/fZu3cw2Mnfr0d7N3ws1kA00). Downloads and source remain available without payment.
          NOTES

          # Prepend this version's CHANGELOG section above the install guide, so the
          # release opens with what changed (matching the DragonBreath releases).
          if [ -n "$(printf '%s' "$changelog" | tr -d '[:space:]')" ]; then
            { printf "## What's new in %s\n%s\n\n" "$RELEASE_TAG" "$changelog"; cat release_notes.md; } > release_notes.md.new
            mv release_notes.md.new release_notes.md
          fi

          # A semver pre-release tag carries a hyphenated suffix (v0.4.0-rc1,
          # v1.0.0-beta2). Publish those as GitHub pre-releases so they are not
          # marked "Latest" — otherwise a test build displaces the current
          # stable release for everyone using the install helper's default.
          PRERELEASE_FLAGS=""
          case "$RELEASE_TAG" in
            *-*) PRERELEASE_FLAGS="--prerelease"
                 echo "Publishing $RELEASE_TAG as a pre-release" ;;
            *)   PRERELEASE_FLAGS="--latest"
                 echo "Publishing $RELEASE_TAG as a stable release" ;;
          esac

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file release_notes.md $PRERELEASE_FLAGS
          else
            gh release create "$RELEASE_TAG" dist/* \
              --title "$RELEASE_TAG" \
              --notes-file release_notes.md $PRERELEASE_FLAGS
          fi
